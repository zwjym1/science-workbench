[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipbench"
version = "0.1.0"
description = "Batch evaluation runner, metrics and version reports for clipagent"
requires-python = ">=3.12,<3.14"
dependencies = ["clipagent"]

[project.optional-dependencies]
dev = ["clipagent[langchain]"]

[project.scripts]
clipbench = "clipbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clipbench*"]

[tool.setuptools.package-data]
clipbench = ["cases/*.json"]
