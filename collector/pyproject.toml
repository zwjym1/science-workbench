[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dycollector"
version = "0.1.0"
description = "Independent guest Douyin capture normalization and task runner"
requires-python = ">=3.12,<3.14"
dependencies = ["SQLAlchemy>=2.0,<2.2", "mcp>=2.3,<3", "psycopg[binary]>=3.3,<4", "filelock>=3.16", "httpx>=0.28,<1"]

[project.optional-dependencies]
content = ["faster-whisper==1.2.1"]

[project.scripts]
dycollector = "dycollector.cli:main"
dycollector-mcp = "dycollector.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dycollector*"]
