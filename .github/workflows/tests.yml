name: tests

on: [push, pull_request]

jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install collector deps
        run: |
          cd collector
          pip install -e .
      - name: Run 62 unit tests
        run: cd collector && python -m unittest discover -s tests -v

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest tests -q

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install agent
        run: |
          cd agent
          pip install -e .
          pip install -e '.[langchain]'
      - name: Unit tests (36)
        run: cd agent && python -m unittest discover -s tests -v
      - name: Demo pipeline against scripted model
        run: |
          cd agent
          clipagent demo --workdir /tmp/clipagent-ci
          python - <<'PY'
          import json, pathlib
          runs = list(pathlib.Path('/tmp/clipagent-ci/runs').glob('*.jsonl'))
          assert runs, 'no trace written'
          rows = [json.loads(l) for l in runs[0].read_text(encoding='utf-8').splitlines() if l.strip()]
          kinds = {r['kind'] for r in rows}
          assert {'plan', 'tool', 'final'} <= kinds, kinds
          print('trace ok:', len(rows), 'entries')
          PY

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          pip install -e agent
          pip install -e bench
      - name: Unit tests (34)
        run: cd bench && python -m unittest discover -s tests -v
      - name: Run the shipped case set end to end
        run: |
          cd bench
          clipbench run --workdir /tmp/bench-work --out /tmp/bench-out
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('/tmp/bench-out/results.json').read_text(encoding='utf-8'))
          s = data['summary']
          assert s['cases'] == 8, s['cases']
          assert s['success_rate'] >= 0.875, s['success_rate']
          assert s['quality_mean'] is None, 'quality must stay unscored without rubrics'
          assert pathlib.Path('/tmp/bench-out/attribution.md').is_file()
          print('benchmark ok:', s['passed'], '/', s['cases'])
          PY
