name: tests

on: [push, pull_request]

jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install collector deps
        run: |
          cd collector
          pip install -e .
      - name: Run 62 unit tests
        run: cd collector && python -m unittest discover -s tests -v

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest tests -q

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install agent
        run: |
          cd agent
          pip install -e .
          pip install -e '.[langchain]'
      - name: Unit tests (36)
        run: cd agent && python -m unittest discover -s tests -v
      - name: Demo pipeline against scripted model
        run: |
          cd agent
          clipagent demo --workdir /tmp/clipagent-ci
          python - <<'PY'
          import json, pathlib
          runs = list(pathlib.Path('/tmp/clipagent-ci/runs').glob('*.jsonl'))
          assert runs, 'no trace written'
          rows = [json.loads(l) for l in runs[0].read_text(encoding='utf-8').splitlines() if l.strip()]
          kinds = {r['kind'] for r in rows}
          assert {'plan', 'tool', 'final'} <= kinds, kinds
          print('trace ok:', len(rows), 'entries')
          PY

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Install
        run: |
          pip install -e agent
          pip install -e bench
      - name: Unit tests (34)
        run: cd bench && python -m unittest discover -s tests -v
      - name: Run the shipped case set end to end
        run: |
          cd bench
          clipbench run --workdir /tmp/bench-work --out /tmp/bench-out
          python - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path('/tmp/bench-out/results.json').read_text(encoding='utf-8'))
          s = data['summary']
          print('summary:', {k: s[k] for k in ('cases', 'passed', 'success_rate', 'quality_mean')})
          failures = [(c['case_id'], c['status'],
                       [x['name'] for x in c['checks'] if not x['ok']])
                      for c in data['cases'] if not c['passed']]
          for case_id, status, checks in failures:
              print('  FAILED', case_id, status, checks)
          problems = []
          if s['cases'] != 8:
              problems.append(f"expected 8 cases, got {s['cases']}")
          if s['success_rate'] < 0.875:
              problems.append(f"success_rate {s['success_rate']} < 0.875")
          if s['quality_mean'] is not None:
              problems.append('quality must stay unscored without rubrics')
          if not pathlib.Path('/tmp/bench-out/attribution.md').is_file():
              problems.append('attribution.md was not written')
          if problems:
              print('FAILED:', '; '.join(problems))
              sys.exit(1)
          print('benchmark ok:', s['passed'], '/', s['cases'])
          PY
